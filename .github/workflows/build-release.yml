name: Build & Release APK

# 源码在 suwei8/MyIPTV, 构建产物(APK + version.json)发布到本公开仓库,
# 供已安装的 App 通过 GitHub Releases API 检查更新并覆盖安装(免卸载热更新)。
on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 (如 v1.1.15)'
        required: true
      ref:
        description: '源码 ref (默认取同名 tag)'
        required: false
  repository_dispatch:
    types: [myiptv-release]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 解析版本
        id: v
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG="${{ inputs.tag }}"
          fi
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="$TAG"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "构建版本: $TAG (ref=$REF)"

      - name: 拉取源码 suwei8/MyIPTV
        uses: actions/checkout@v4
        with:
          repository: suwei8/MyIPTV
          ref: ${{ steps.v.outputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库 secrets 配了 KEYSTORE_* 就出正式签名包(可覆盖安装); 否则 debug 签名兜底
      - name: 准备签名 keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/ks.jks"
            cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/ks.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
            echo "signed=release" >> "$GITHUB_ENV"
          else
            echo "::warning::未配置 KEYSTORE_* secrets, 退化为 debug 签名(无法覆盖安装)"
            echo "signed=debug" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建 APK
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          if [ "$signed" = "release" ]; then
            gradle assembleRelease --no-daemon
            APK_SRC=app/build/outputs/apk/release/app-release.apk
            APK_NAME="MyIPTV-${TAG}.apk"
          else
            gradle assembleDebug --no-daemon
            APK_SRC=app/build/outputs/apk/debug/app-debug.apk
            APK_NAME="MyIPTV-${TAG}-debug.apk"
          fi
          cp "$APK_SRC" "$APK_NAME"
          VC=$(grep -oP 'versionCode\s+\K[0-9]+' app/build.gradle)
          VN=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle)
          echo "versionCode=$VC" >> "$GITHUB_ENV"
          echo "versionName=$VN" >> "$GITHUB_ENV"
          echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"
          cat > version.json <<EOF
          {
            "versionCode": ${VC},
            "versionName": "${VN}",
            "apk": "https://github.com/suwei8/MyIPTV-dist/releases/download/${TAG}/${APK_NAME}",
            "apkName": "${APK_NAME}",
            "signed": "${signed}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo '--- version.json ---'; cat version.json; echo; ls -la *.apk

      - name: 发布 Release (APK + version.json)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.tag }}
          files: |
            MyIPTV-*.apk
            version.json
          body: |
            ${{ steps.v.outputs.tag }} — CI 自动构建 (${{ env.signed }} 签名)
            versionCode: ${{ env.versionCode }} / versionName: ${{ env.versionName }}

            已安装用户可在应用内「设置 → 检查更新」或启动时自动检测并覆盖安装。
          generate_release_notes: true
