name: Auto-maintain iptv.txt

# 定时检测 suwei8/blog 仓库中 iptv.txt 的直播源有效性,
# 对失效源自动从上游聚合列表中找替补并提交回 blog 仓库.
# 需要的 secret: BLOG_TOKEN (对 suwei8/blog 有 contents:write 权限的 PAT)

on:
  schedule:
    - cron: '23 2,14 * * *'   # 北京时间 10:23 / 22:23 各一次
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check & update iptv.txt
        env:
          BLOG_TOKEN: ${{ secrets.BLOG_TOKEN }}
        run: python3 tools/update_iptv.py
